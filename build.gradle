    tasks.register('verifyMinoshroomCombatContract') {
        group = 'verification'
        description = 'Ensures Minoshroom stomp damage bypasses shields through data.'
        def combatFile = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/minoshroom/MinoshroomCombat.java')
        def damageTypesFile = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/minoshroom/MinoshroomDamageTypes.java')
            def combatRulesFile = file(
                'src/main/java/com/tonywww/bossrefactortf/boss/minoshroom/MinoshroomCombatRules.java')
        def stompDamageTypeFile = file(
            'src/main/resources/data/bossrefactortf/damage_type/minoshroom_stomp.json')
        def bypassesShieldFile = file(
            'src/main/resources/data/minecraft/tags/damage_type/bypasses_shield.json')
            inputs.files(combatFile, damageTypesFile, combatRulesFile,
                stompDamageTypeFile, bypassesShieldFile)
        doLast {
        if (!combatFile.getText('UTF-8').contains(
            'MinoshroomDamageTypes.stomp(minoshroom)')) {
            throw new GradleException(
                'Minoshroom stomp must use the dedicated damage source')
        }
        if (!damageTypesFile.getText('UTF-8').contains(
            'MinoshroomCombatRules.stompDamageTypePath()')
            || !combatRulesFile.getText('UTF-8').contains(
                'STOMP_DAMAGE_TYPE_PATH = "minoshroom_stomp"')) {
            throw new GradleException(
                'Minoshroom stomp must declare its damage type key')
        }
        def damageType = new groovy.json.JsonSlurper().parse(stompDamageTypeFile)
        if (damageType.message_id != 'mob') {
            throw new GradleException(
                'Minoshroom stomp damage type must remain an entity attack')
        }
        def bypassesShield = new groovy.json.JsonSlurper().parse(bypassesShieldFile)
        if (!bypassesShield.values.contains('bossrefactortf:minoshroom_stomp')) {
            throw new GradleException(
                'Minoshroom stomp must be tagged to bypass shields')
        }
        }
    }

    tasks.named('minoshroomCombatSelfTest').configure {
        dependsOn tasks.named('verifyMinoshroomCombatContract')
    }

