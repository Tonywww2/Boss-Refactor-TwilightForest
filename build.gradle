plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'bossrefactortf.refmap.json'
    config 'bossrefactortf.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    flatDir {
        name = 'Local mods'
        dirs 'libs'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf(
            "curse.maven:the-twilight-forest-227639:${twilight_forest_file_id}")

    compileOnly fg.deobf("local:slashblade_sendims:${sendims_version}")

    tasks.register('hydraCombatSelfTest', JavaExec) {
        group = 'verification'
        description = 'Runs dependency-free Hydra combat-rule checks.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.tonywww.bossrefactortf.boss.hydra.HydraCombatRulesSelfTest'
    }

    tasks.register('verifyHydraNineHeadContract') {
        group = 'verification'
        description = 'Checks the nine-head multipart expansion and Hydra attack ownership contract.'
        def hydraMixin = file(
            'src/main/java/com/tonywww/bossrefactortf/mixin/boss/HydraMixin.java')
        def containerMixin = file(
            'src/main/java/com/tonywww/bossrefactortf/mixin/boss/HydraHeadContainerMixin.java')
        def legacyRendererMixin = file(
            'src/main/java/com/tonywww/bossrefactortf/mixin/client/HydraHeadRendererMixin.java')
        def newRendererMixin = file(
            'src/main/java/com/tonywww/bossrefactortf/mixin/client/NewHydraHeadRendererMixin.java')
        def combat = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/hydra/HydraCombat.java')
        def combatRules = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/hydra/HydraCombatRules.java')
        def combatState = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/hydra/HydraCombatState.java')
        def fireball = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/hydra/HydraEvilFireball.java')
        def entityRegistry = file(
            'src/main/java/com/tonywww/bossrefactortf/registry/BossRefactorTwilightForestEntities.java')
        def mixinConfig = file('src/main/resources/bossrefactortf.mixins.json')
        def bypassesShield = file(
            'src/main/resources/data/minecraft/tags/damage_type/bypasses_shield.json')
        def isFire = file(
            'src/main/resources/data/minecraft/tags/damage_type/is_fire.json')
        def hydraDamageType = file(
            'src/main/resources/data/bossrefactortf/damage_type/hydra_evil_fire.json')
        def hydraConfig = file(
            'src/main/java/com/tonywww/bossrefactortf/config/BossRefactorTwilightForestConfig.java')
        inputs.files(
            hydraMixin, containerMixin, legacyRendererMixin,
            newRendererMixin, combat, combatRules, combatState, fireball,
            entityRegistry, mixinConfig, bypassesShield, isFire,
            hydraDamageType, hydraConfig)
        doLast {
            def requirements = [
                (hydraMixin): [
                    'constant = @Constant(intValue = 7)',
                    'method = "<init>"',
                    'method = {"aiStep", "m_8107_"}',
                    'method = {"customServerAiStep", "m_8024_"}',
                    'method = "getRandomDeadHead"',
                    'method = "attackEntity"',
                    'method = "areTooManyHeadsAttacking"',
                    'method = "countActiveHeads"',
                    'method = "areOtherHeadsBiting"',
                    'method = "secondaryAttacks"',
                    'method = "isAnyHeadTargeting"',
                    'method = "attackEntityFromPart"',
                    'method = {"tickDeath", "m_6153_"}',
                    'return 9;',
                    '@Invoker(value = "activateNumberOfHeads", remap = false)'
                ],
                (containerMixin): [
                    'require = 5',
                    'stateYRotations, 5, 7, 30.0F',
                    'stateYRotations, 6, 8, -30.0F',
                    'method = "setNeckPosition()V"',
                    'headNum != 7 && headNum != 8',
                    'headNum == 7 ? 165.0F : -165.0F'
                ],
                (legacyRendererMixin): ['method = "getHeadObject"', 'return 9;'],
                (newRendererMixin): ['method = "getHeadObject"', 'return 9;'],
                (combat): [
                    'Math.min(9, countActiveHeads(hydra) + 2)',
                    'HydraActionState.EVIL_FIREBALL_WINDUP',
                    'shouldSuppressVanillaAttackSelection(',
                    'hasVanillaAttackInProgress(',
                    'HydraCombatRules.customMeleeSkill(',
                    'spawnTargetedBeams(',
                    'spawnScatteredBeams(',
                    'HydraCombatRules.phaseDamage(',
                    'HydraCombatRules.fireLordMultiplier('
                ],
                (combatRules): [
                    'public static float phaseDamage(',
                    'public static float fireLordMultiplier(',
                    'public static HydraSkill customMeleeSkill('
                ],
                (combatState): [
                    'tag.putInt("EvilFireballCooldown", evilFireballCooldown);',
                    'tag.putBoolean("SecondPhaseHeadsActivated", secondPhaseHeadsActivated);',
                    'tag.put("Beams", beamTags);'
                ],
                (fireball): [
                    'NetworkHooks.getEntitySpawningPacket(this)',
                    'ProjectileUtil.getHitResultOnMoveVector(',
                    'if (isRemoved()) {',
                    'setLockedDirection(',
                    'discard();',
                    'Math.max(20, auraInterval)',
                    'evilFireballAuraIntervalTicks',
                    'addAdditionalSaveData(CompoundTag tag)'
                ],
                (hydraConfig): [
                    '"aura_interval_ticks", 20, 20, 1200'
                ],
                (entityRegistry): ['"hydra_evil_fireball"'],
                (mixinConfig): [
                    'client.HydraHeadRendererMixin',
                    'client.NewHydraHeadRendererMixin'
                ],
                (bypassesShield): ['bossrefactortf:hydra_evil_fire']
            ]
            def missing = []
            requirements.each { source, fragments ->
                String text = source.getText('UTF-8')
                fragments.findAll { !text.contains(it) }.each {
                    missing.add("${source.name}: ${it}")
                }
            }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Hydra nine-head contract is incomplete: ${missing}")
            }
            def expectedHeadLimitRequires = [
                '"<init>"': 3,
                '{"aiStep", "m_8107_"}': 3,
                '{"customServerAiStep", "m_8024_"}': 3,
                '"getRandomDeadHead"': 1,
                '"attackEntity"': 1,
                '"areTooManyHeadsAttacking"': 1,
                '"countActiveHeads"': 1,
                '"areOtherHeadsBiting"': 1,
                '"secondaryAttacks"': 2,
                '"isAnyHeadTargeting"': 1,
                '"attackEntityFromPart"': 1,
                '{"tickDeath", "m_6153_"}': 1
            ]
            String hydraMixinText = hydraMixin.getText('UTF-8')
            def selectorFailures = []
            expectedHeadLimitRequires.each { selector, expectedRequire ->
                def pattern = "(?s)@ModifyConstant\\s*\\(\\s*method\\s*=\\s*${java.util.regex.Pattern.quote(selector)}\\s*,\\s*constant\\s*=\\s*@Constant\\(intValue\\s*=\\s*7\\)\\s*,\\s*require\\s*=\\s*(\\d+)\\s*,\\s*remap\\s*=\\s*false\\s*\\)"
                def matcher = hydraMixinText =~ pattern
                if (!matcher.find()) {
                    selectorFailures.add("missing 7-limit selector ${selector}")
                } else if (Integer.parseInt(matcher.group(1)) != expectedRequire) {
                    selectorFailures.add(
                        "7-limit selector ${selector} requires ${matcher.group(1)}, expected ${expectedRequire}")
                }
            }
            int actualSevenLimitSelectors = (
                    hydraMixinText =~ /constant\s*=\s*@Constant\(intValue\s*=\s*7\)/)
                    .findAll().size()
            if (actualSevenLimitSelectors != expectedHeadLimitRequires.size()) {
                selectorFailures.add(
                    "found ${actualSevenLimitSelectors} Hydra 7-limit selectors, expected ${expectedHeadLimitRequires.size()}")
            }
            if (!selectorFailures.isEmpty()) {
                throw new GradleException(
                    "Hydra nine-head selector contract failed: ${selectorFailures}")
            }

            String containerMixinText = containerMixin.getText('UTF-8')
            def expectedAnimationCopies = [
                'stateNeckLength, 5, 7, 0.0F',
                'stateXRotations, 5, 7, 0.0F',
                'stateYRotations, 5, 7, 30.0F',
                'stateMouthOpen, 5, 7, 0.0F',
                'stateNeckLength, 6, 8, 0.0F',
                'stateXRotations, 6, 8, 0.0F',
                'stateYRotations, 6, 8, -30.0F',
                'stateMouthOpen, 6, 8, 0.0F'
            ]
            def animationFailures = expectedAnimationCopies.findAll {
                !containerMixinText.contains(it)
            }
            if (!containerMixinText.contains(
                    'BOSS_REFACTOR_TF$VANILLA_STATE_COUNT = 17')
                    || !containerMixinText.contains(
                            'Hydra head animation maps were not initialized')
                    || !containerMixinText.contains(
                            'Expanded Hydra head animation map is incomplete')) {
                animationFailures.add(
                    'the 17-state head-animation completeness guards')
            }
            if (containerMixinText.indexOf('method = "<init>"')
                    > containerMixinText.indexOf('method = "setupStateRotations"')) {
                animationFailures.add(
                    'constructor array expansion must precede state-map copying')
            }
            if (!animationFailures.isEmpty()) {
                throw new GradleException(
                    "Hydra expanded head animation contract failed: ${animationFailures}")
            }

            def vanillaAttackOwnershipFailures = []
            if (containerMixinText.contains('method = "executeAttacks"')) {
                vanillaAttackOwnershipFailures.add(
                    'HydraHeadContainer.executeAttacks must remain fully vanilla')
            }
            if (!hydraMixinText.contains(
                    'HydraCombat.shouldSuppressVanillaAttackSelection(')) {
                vanillaAttackOwnershipFailures.add(
                    'Hydra vanilla selection may only pause for custom attack ownership')
            }
            if (combat.getText('UTF-8').contains('HydraHeadStateBridge')
                    || file('src/main/java/com/tonywww/bossrefactortf/boss/hydra/HydraHeadStateBridge.java').exists()) {
                vanillaAttackOwnershipFailures.add(
                    'Hydra flame breath must be scheduled and executed by Twilight Forest')
            }
            if (!vanillaAttackOwnershipFailures.isEmpty()) {
                throw new GradleException(
                    "Hydra vanilla attack ownership failed: ${vanillaAttackOwnershipFailures}")
            }

            def splitPackageSources = fileTree('src/main/java/twilightforest') {
                include '**/*.java'
            }.files
            if (!splitPackageSources.isEmpty()) {
                throw new GradleException(
                    "Hydra compatibility must not create a Twilight Forest split package: ${splitPackageSources}")
            }

            int baseMultipartParts = 4
            int partsPerHead = 6
            int expandedHeadCount = 9
                int expectedMultipartParts = baseMultipartParts + expandedHeadCount * partsPerHead
            if (expectedMultipartParts != 58) {
                throw new GradleException(
                    "Hydra multipart count changed: ${expectedMultipartParts}")
            }

            def jsonSlurper = new groovy.json.JsonSlurper()
            def damageTagFailures = []
            [(bypassesShield): 'bypasses_shield', (isFire): 'is_fire'].each {
                    tagFile, tagName ->
                def tag = jsonSlurper.parse(tagFile)
                def values = tag.values as List
                if (tag.replace != false) {
                    damageTagFailures.add("${tagName} must append instead of replace")
                }
                if (!values.contains('bossrefactortf:hydra_evil_fire')) {
                    damageTagFailures.add("${tagName} must contain hydra_evil_fire")
                }
                def nonCustomValues = values.findAll {
                    !(it instanceof String) || !it.startsWith('bossrefactortf:')
                }
                if (!nonCustomValues.isEmpty()) {
                    damageTagFailures.add(
                        "${tagName} must not add non-custom damage types: ${nonCustomValues}")
                }
            }
            if (!damageTagFailures.isEmpty()) {
                throw new GradleException(
                    "Hydra damage tag contract failed: ${damageTagFailures}")
            }

            def legacyFollowUpSources = [combat, combatState, hydraConfig]
                    .findAll { it.getText('UTF-8').toLowerCase().contains('followup') }
            if (!legacyFollowUpSources.isEmpty()) {
                throw new GradleException(
                    "Hydra follow-up contract must stay removed: ${legacyFollowUpSources*.name}")
            }
        }
    }
    if (project.hasProperty('enableSenDimsRuntime')) {
        runtimeOnly fg.deobf(
                "curse.maven:slashblade-resharped-1022428:${slashblade_file_id}")
        runtimeOnly fg.deobf("local:slashblade_sendims:${sendims_version}")
    }

    runtimeOnly fg.deobf(
            "mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version             : minecraft_version,
            minecraft_version_range       : minecraft_version_range,
            forge_version                 : forge_version,
            forge_version_range           : forge_version_range,
            loader_version_range          : loader_version_range,
            twilight_forest_version_range : twilight_forest_version_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_license                   : mod_license,
            mod_version                   : mod_version,
            mod_authors                   : mod_authors,
            mod_description               : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude '**/gametest/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

