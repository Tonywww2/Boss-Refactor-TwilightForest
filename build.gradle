tasks.register('verifyOptionalSenDimsIsolation') {
    group = 'verification'
    description = 'Ensures only the delayed SenDimS compat package links against its API.'
    def coreSources = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/compat/sendims/**'
    }
    inputs.files(coreSources)
    doLast {
        def leaks = coreSources.files.findAll {
            it.getText('UTF-8').contains('com.tonywww.slashblade_sendims')
        }
        if (!leaks.isEmpty()) {
            throw new GradleException("SenDimS API leaked into core classes: ${leaks}")
        }
    }
}

tasks.register('verifyDefaultRuntimeOmitsSenDims') {
    group = 'verification'
    description = 'Ensures the default runtime classpath excludes SenDimS and SlashBlade.'
    doLast {
        if (project.hasProperty('enableSenDimsRuntime')) {
            return
        }
        def leaks = configurations.runtimeClasspath.files.findAll {
            it.name.contains('slashblade_sendims') ||
                    it.name.contains('slashblade-resharped')
        }
        if (!leaks.isEmpty()) {
            throw new GradleException(
                    "SenDimS runtime dependencies leaked into the default runtime: ${leaks}")
        }
    }
}

tasks.register('verifyMixinRefmapContract') {
    group = 'verification'
    description = 'Ensures production Mixin targets have refmap or explicit SRG mappings.'
    dependsOn tasks.named('compileJava')
    def mixinConfigFile = file('src/main/resources/bossrefactortf.mixins.json')
    def generatedRefmapFile = file(
            "$buildDir/tmp/compileJava/bossrefactortf.refmap.json")
    def attackGoalsMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/PhantomAttackGoalsMixin.java')
    def formationGoalMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/PhantomUpdateFormationAndMoveGoalMixin.java')
    def throwWeaponInvokerMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/PhantomThrowWeaponGoalAccessMixin.java')
    def alphaYetiMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/AlphaYetiMixin.java')
    def fallingIceMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/FallingIceMixin.java')
    def urGhastMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/UrGhastMixin.java')
    def urGhastFireballMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/UrGhastFireballMixin.java')
    def largeFireballTelegraphMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/LargeFireballTelegraphMixin.java')
    def largeFireballRendererMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/client/LargeFireballRendererMixin.java')
    def carminiteTrapMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/CarminiteGhastguardTrapMixin.java')
    def ghastTrapMixinFile = file(
        'src/main/java/com/tonywww/bossrefactortf/mixin/boss/GhastTrapBlockEntityMixin.java')
    inputs.files(mixinConfigFile, generatedRefmapFile,
        attackGoalsMixinFile, formationGoalMixinFile,
        throwWeaponInvokerMixinFile, alphaYetiMixinFile,
        fallingIceMixinFile, urGhastMixinFile,
        urGhastFireballMixinFile, largeFireballTelegraphMixinFile,
        largeFireballRendererMixinFile, carminiteTrapMixinFile,
        ghastTrapMixinFile)
    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def mixinConfig = jsonSlurper.parse(mixinConfigFile)
        if (mixinConfig.refmap != generatedRefmapFile.name) {
            throw new GradleException(
                    "Mixin config must declare refmap '${generatedRefmapFile.name}'")
        }

        def mappings = jsonSlurper.parse(generatedRefmapFile).mappings
        def requiredMappings = [
                'com/tonywww/bossrefactortf/mixin/boss/KnightPhantomTargetGoalMixin': [
                        canContinueToUse:
                                'Lnet/minecraft/world/entity/ai/goal/target/TargetGoal;m_8045_()Z'
                ],
                'com/tonywww/bossrefactortf/mixin/boss/KnightPhantomNearestTargetGoalMixin': [
                        canUse:
                                'Lnet/minecraft/world/entity/ai/goal/target/NearestAttackableTargetGoal;m_8036_()Z'
                ],
                'com/tonywww/bossrefactortf/mixin/client/LargeFireballRendererMixin': [
                    ('render(Lnet/minecraft/world/entity/Entity;FF' +
                        'Lcom/mojang/blaze3d/vertex/PoseStack;' +
                        'Lnet/minecraft/client/renderer/MultiBufferSource;I)V'):
                        ('Lnet/minecraft/client/renderer/entity/ThrownItemRenderer;' +
                        'm_7392_(Lnet/minecraft/world/entity/Entity;FF' +
                        'Lcom/mojang/blaze3d/vertex/PoseStack;' +
                        'Lnet/minecraft/client/renderer/MultiBufferSource;I)V')
                ]
        ]
        def mismatches = []
        requiredMappings.each { mixinClass, methods ->
            methods.each { method, expectedTarget ->
                def actualTarget = mappings[mixinClass]?.get(method)
                if (actualTarget != expectedTarget) {
                    mismatches.add(
                            "${mixinClass}.${method}: expected ${expectedTarget}, got ${actualTarget}")
                }
            }
        }
        if (!mismatches.isEmpty()) {
            throw new GradleException(
                    "Production Mixin mappings are missing or incorrect: ${mismatches}")
        }

        def explicitSrgSelectors = [
                (attackGoalsMixinFile):
                        ['method = {"canUse", "m_8036_"}'],
                (formationGoalMixinFile):
                        [
                                'method = {"canUse", "m_8036_"}',
                                'method = {"tick", "m_8037_"}'
                    ],
                (alphaYetiMixinFile):
                    [
                        'method = {"registerGoals", "m_8099_"}',
                        'method = {"defineSynchedData", "m_8097_"}',
                        'method = {"aiStep", "m_8107_"}',
                        'method = {"addAdditionalSaveData", "m_7380_"}',
                        'method = {"readAdditionalSaveData", "m_7378_"}'
                    ],
                (fallingIceMixinFile):
                    [
                        'method = {"defineSynchedData", "m_8097_"}',
                        'method = {"tick", "m_8119_"}',
                        'method = {"addAdditionalSaveData", "m_7380_"}',
                        'method = {"readAdditionalSaveData", "m_7378_"}'
                        ],
                (urGhastMixinFile):
                    [
                        'method = "registerAttributes"',
                        'method = {"registerGoals", "m_8099_"}',
                        'method = {"defineSynchedData", "m_8097_"}',
                        'method = {"hurt", "m_6469_"}',
                        'method = {"getHurtSound", "m_7975_"}',
                        'method = {"customServerAiStep", "m_8024_"}',
                        'method = "spitFireball"',
                        'bossRefactorTF$self().spawnGhastsAtTraps();',
                        'target = "Ltwilightforest/entity/boss/UrGhast;setTarget(Lnet/minecraft/world/entity/LivingEntity;)V"',
                        'target = "Ltwilightforest/entity/boss/UrGhast;m_6710_(Lnet/minecraft/world/entity/LivingEntity;)V"',
                        'method = {"addAdditionalSaveData", "m_7380_"}',
                        'method = {"readAdditionalSaveData", "m_7378_"}'
                        ],
                (urGhastFireballMixinFile):
                    [
                        'method = {"onHit", "m_6532_"}'
                        ],
                (ghastTrapMixinFile):
                    [
                        'target = "Lnet/minecraft/world/entity/monster/Ghast;setDeltaMovement(DDD)V"',
                        'target = "Lnet/minecraft/world/entity/monster/Ghast;m_20334_(DDD)V"',
                        'target = "Lnet/minecraft/world/entity/monster/Ghast;hurt(Lnet/minecraft/world/damagesource/DamageSource;F)Z"',
                        'target = "Lnet/minecraft/world/entity/monster/Ghast;m_6469_(Lnet/minecraft/world/damagesource/DamageSource;F)Z"'
                        ]
        ]
        def missingSelectors = explicitSrgSelectors.collectMany {
                sourceFile, selectors ->
            def source = sourceFile.getText('UTF-8')
            selectors.findAll { !source.contains(it) }.collect {
                "${sourceFile.name}: ${it}"
            }
        }
        if (!missingSelectors.isEmpty()) {
            throw new GradleException(
                    "Explicit SRG Mixin selectors are missing: ${missingSelectors}")
        }

        if (!mixinConfig.mixins.contains(
                'boss.PhantomThrowWeaponGoalAccessMixin')) {
            throw new GradleException(
                    'The custom state machine must register the vanilla skill invoker Mixin')
        }
        for (String mixinName : ['boss.AlphaYetiMixin',
                     'boss.FallingIceMixin',
                     'boss.UrGhastMixin',
                     'boss.UrGhastFireballMixin',
                     'boss.LargeFireballTelegraphMixin',
                     'boss.CarminiteGhastguardTrapMixin',
                     'boss.GhastTrapBlockEntityMixin']) {
            if (!mixinConfig.mixins.contains(mixinName)) {
                throw new GradleException(
                        "The Alpha Yeti takeover must register ${mixinName}")
            }
        }
            if (!mixinConfig.client.contains(
                'client.LargeFireballRendererMixin')) {
                throw new GradleException(
                    'The Ur-Ghast fireball must register its client renderer Mixin')
            }
        def throwWeaponInvoker = throwWeaponInvokerMixinFile.getText('UTF-8')
        for (String method : ['@Invoker("launchAxeAt")',
                              '@Invoker("launchPicks")']) {
            if (!throwWeaponInvoker.contains(method)) {
                throw new GradleException(
                        "Vanilla Knight Phantom skill invoker is missing: ${method}")
            }
        }
    }
}

tasks.register('verifySenDimsSkeletonContracts') {
    group = 'verification'
    description = 'Checks SenDimS EXTERNAL Leader activation and combat traits.'
    def modFile = file(
            'src/main/java/com/tonywww/bossrefactortf/BossRefactorTwilightForest.java')
    def integrationFile = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/TwilightBossParryIntegration.java')
    def compatFile = file(
            'src/main/java/com/tonywww/bossrefactortf/compat/sendims/TwilightForestSenDimsCompat.java')
        def bootstrapFile = file(
            'src/main/java/com/tonywww/bossrefactortf/compat/OptionalCompatBootstrap.java')
    def traitsFile = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/TwilightBossSenDimsEvents.java')
    def rulesFile = file(
            'src/main/java/com/tonywww/bossrefactortf/boss/TwilightBossSenDimsRules.java')
        def providerFile = file(
            'src/main/java/com/tonywww/bossrefactortf/compat/sendims/client/ExternalLeaderIndicatorProvider.java')
        inputs.files(modFile, integrationFile, compatFile, bootstrapFile,
            traitsFile, rulesFile, providerFile)
    doLast {
        def mod = modFile.getText('UTF-8')
        def integration = integrationFile.getText('UTF-8')
        def compat = compatFile.getText('UTF-8')
        def bootstrap = bootstrapFile.getText('UTF-8')
        def traits = traitsFile.getText('UTF-8')
        def rules = rulesFile.getText('UTF-8')
        def provider = providerFile.getText('UTF-8')
        def required = [
                'TwilightBossParryIntegration.install(compat)',
                '@SubscribeEvent(priority = EventPriority.LOWEST)',
                'event.setDecision(LeaderParryDecision.PARRY)',
                'LeaderParriedEvent',
                'LeaderApi.isParryable(boss)',
                'LeaderApi.isParried(boss)',
            'LeaderApi.registerLeader(',
            'boss, LeaderProfile.EXTERNAL',
            'snapshot.profile() == LeaderProfile.EXTERNAL',
            'return ensureActive(boss) && LeaderApi.isParryable(boss);',
            'return ensureActive(boss) && LeaderApi.isParried(boss);',
            'return ensureActive(boss) && LeaderApi.openParryWindow(boss);',
            'return ensureActive(boss) && LeaderApi.closeParryWindow(boss);',
            'registerClientIndicatorProvider()',
            'Class.forName(CLIENT_INDICATOR_PROVIDER)',
                'LeaderProfile.EXTERNAL',
            'ClientLeaderIndicatorApi.registerExternalWarningProvider(',
            'ExternalLeaderIndicatorProvider::warningProgress',
            'bossRefactorTF$isCurrentAttackParryable()',
            'ParryIndicatorStyle.isVisible(true, telegraph)',
            'OptionalDouble.of(telegraph.progress())',
            'OptionalDouble.of(1.0)'
        ]
        def combined = (compat + '\n' + provider + '\n' + traits + '\n'
            + rules + '\n' + bootstrap + '\n' + integration)
        def missing = required.findAll { !combined.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("SenDimS skeleton contracts are missing: ${missing}")
        }
        def migratedRenderingContracts = [
            'RenderLivingEvent',
            'ClientTickEvent',
            'DustColorTransitionOptions',
            'Component.literal("危")',
            'particleEngine'
        ]
        def retainedRenderingContracts = migratedRenderingContracts.findAll {
            provider.contains(it)
        }
        if (!retainedRenderingContracts.isEmpty()) {
            throw new GradleException(
                "Rendering must be owned by SenDimS: ${retainedRenderingContracts}")
        }
        if (!mod.contains('TFEntities.KNIGHT_PHANTOM.get()')
                || !mod.contains('TFEntities.ALPHA_YETI.get()')) {
            throw new GradleException(
                    'Knight Phantom and Alpha Yeti must be registered as EXTERNAL Leaders')
        }
        def requiredTraits = [
            'bridge.ensureActive(boss)',
            'bridge.usesExternalProfile(boss)',
            'AttributeModifier.Operation.MULTIPLY_TOTAL',
            'MAXIMUM_HEALTH_MULTIPLIER = 6.0',
            'MAXIMUM_HEALTH_MODIFIER_AMOUNT =',
            'PARRIED_DAMAGE_MULTIPLIER = 5.0',
            'throw new IllegalStateException('
        ]
        def missingTraits = requiredTraits.findAll { !combined.contains(it) }
        if (!missingTraits.isEmpty()) {
            throw new GradleException(
                "SenDimS boss traits are missing: ${missingTraits}")
        }
        if (traits.contains('LivingHurtEvent')) {
            throw new GradleException(
                'Parried damage must remain owned by the SenDimS Leader hurt listener')
        }
        if (!integration.contains('new LinkedHashSet<>()')) {
            throw new GradleException('External Leader type registration must remain deduplicated')
        }
    }
}

tasks.register('verifySenDimsCombatConstants', JavaExec) {
    group = 'verification'
    description = 'Ensures local SenDimS uses and registers the expected Leader combat multipliers.'
    classpath = files("${System.getProperty('java.home')}/../lib/tools.jar")
    mainClass = 'com.sun.tools.javap.Main'
    args '-classpath', file("libs/slashblade_sendims-${sendims_version}.jar"),
            '-p', '-constants', '-c',
            'com.tonywww.slashblade_sendims.SBSDValues',
            'com.tonywww.slashblade_sendims.leader.LeaderCombatHandler',
            'com.tonywww.slashblade_sendims.events.LeaderEventListener'
    standardOutput = new ByteArrayOutputStream()
    doLast {
        String output = standardOutput.toString('UTF-8')
        def expectedConstants = [
            'public static final double LEADER_HP_SCALE = 5.0d;',
            'public static final float PARRIED_DAMAGE_SCALE = 5.0f;',
            'public static void scaleIncomingDamage(',
            '// float 5.0f',
            'public static void LivingHurtEventListener(',
            '// Method com/tonywww/slashblade_sendims/api/leader/LeaderApi.isLeader:',
            '// Method com/tonywww/slashblade_sendims/leader/LeaderCombatHandler.scaleIncomingDamage:'
        ]
        def missing = expectedConstants.findAll { !output.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "SenDimS Leader combat constants changed: ${missing}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('telegraphSelfTest')
    dependsOn tasks.named('knightPhantomCombatSelfTest')
    dependsOn tasks.named('alphaYetiCombatSelfTest')
    dependsOn tasks.named('twilightBossSenDimsSelfTest')
    dependsOn tasks.named('urGhastCombatSelfTest')
    dependsOn tasks.named('verifyOptionalSenDimsIsolation')
    dependsOn tasks.named('verifyDefaultRuntimeOmitsSenDims')
    dependsOn tasks.named('verifyMixinRefmapContract')
    dependsOn tasks.named('verifySenDimsSkeletonContracts')
    dependsOn tasks.named('verifySenDimsCombatConstants')
}